<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chatbot</title>
    <link rel="stylesheet" href="static/style.css">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
        },
        startup: {
          typeset: false,
        },
      };
      window.notifyMathJaxReady = () => {
        window.dispatchEvent(new Event('mathjax-ready'));
      };
    </script>
    <script
      defer
      src="/static/vendor/mathjax-tex-chtml.js"
      onload="window.notifyMathJaxReady && window.notifyMathJaxReady()"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
